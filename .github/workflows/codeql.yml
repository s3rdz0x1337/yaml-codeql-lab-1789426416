name: codeql
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  security-events: write
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
